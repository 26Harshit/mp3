<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad-Free Bollywood Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .player-container { width: 100%; max-width: 450px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; display: flex; flex-direction: column; height: 85vh; }
        .header { padding: 20px; background: #334155; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #475569; }
        .playlist { flex: 1; overflow-y: auto; padding: 10px; }
        .song-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; margin-bottom: 8px; background: #334155; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .song-item:hover { background: #475569; }
        .song-item.active { background: #3b82f6; }
        .song-info h4 { font-size: 0.95rem; margin-bottom: 4px; }
        .song-info p { font-size: 0.75rem; color: #94a3b8; }
        .song-item.active .song-info p { color: #dbeafe; }
        .controls-section { background: #1e293b; padding: 20px; border-top: 1px solid #334155; }
        .player-info { text-align: center; margin-bottom: 15px; }
        .player-info h3 { font-size: 1.1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-info p { font-size: 0.8rem; color: #94a3b8; }
        .progress-container { background: #475569; border-radius: 4px; height: 6px; width: 100%; cursor: pointer; margin-bottom: 15px; position: relative; }
        .progress-bar { background: #3b82f6; height: 100%; border-radius: 4px; width: 0%; }
        .buttons { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .btn { background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; padding: 10px; border-radius: 50%; transition: 0.2s; }
        .btn:hover { background: #334155; }
        .btn-play { background: #3b82f6; font-size: 1.5rem; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; }
        .btn-play:hover { background: #2563eb; }
        .upload-section { padding: 10px 20px; background: #0f172a; text-align: center; border-top: 1px solid #334155; }
        .upload-btn { background: #10b981; color: white; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; display: inline-block; font-weight: bold; }
        .upload-btn:hover { background: #059669; }
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="player-container">
    <div class="header">🎵 My Ad-Free Bollywood Player</div>
    
    <div class="playlist" id="playlist">
        <!-- Songs will load dynamically here -->
    </div>

    <div class="controls-section">
        <div class="player-info">
            <h3 id="current-title">Select a song</h3>
            <p id="current-artist">Bollywood Artist</p>
        </div>
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="buttons">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn btn-play" id="play-btn">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>
    </div>

    <div class="upload-section">
        <label for="file-input" class="upload-btn">📁 Upload Local MP3 Songs</label>
        <input type="file" id="file-input" accept="audio/mp3" multiple>
    </div>
</div>

<audio id="audio-element"></audio>

<script>
    // Latest Bollywood / Hit Sample Tracks Array (Aap yahan GitHub links ya aur songs add kar sakte hain)
    let tracks = [
        { id: 1, title: 'Saiyaara', artist: 'Jubin Nautiyal, Tanishk Bagchi', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
        { id: 2, title: 'Aavan Jaavan (War 2)', artist: 'Arijit Singh, Pritam', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
        { id: 3, title: 'Zamaana Lage', artist: 'Arijit Singh, Pritam', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' },
        { id: 4, title: 'Tauba Tauba', artist: 'Karan Aujla', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3' },
        { id: 5, title: 'Tumhare Hi Rahenge Hum', artist: 'Sachin-Jigar, Shilpa Rao', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3' },
        { id: 6, title: 'Akhiyaan Gulaab', artist: 'Mitraz', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3' }
    ];

    let currentTrackIndex = 0;
    const audio = document.getElementById('audio-element');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const titleEl = document.getElementById('current-title');
    const artistEl = document.getElementById('current-artist');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const playlistEl = document.getElementById('playlist');
    const fileInput = document.getElementById('file-input');

    function loadPlaylist() {
        playlistEl.innerHTML = '';
        tracks.forEach((track, index) => {
            const div = document.createElement('div');
            div.className = `song-item ${index === currentTrackIndex ? 'active' : ''}`;
            div.innerHTML = `
                <div class="song-info">
                    <h4>${track.title}</h4>
                    <p>${track.artist}</p>
                </div>
            `;
            div.addEventListener('click', () => {
                currentTrackIndex = index;
                playTrack();
            });
            playlistEl.appendChild(div);
        });
    }

    function loadTrack(index) {
        currentTrackIndex = index;
        audio.src = tracks[index].src;
        titleEl.textContent = tracks[index].title;
        artistEl.textContent = tracks[index].artist;
        loadPlaylist();
    }

    function playTrack() {
        loadTrack(currentTrackIndex);
        audio.play();
        playBtn.textContent = '⏸';
    }

    function pauseTrack() {
        audio.pause();
        playBtn.textContent = '▶';
    }

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            if(!audio.src) loadTrack(currentTrackIndex);
            audio.play();
            playBtn.textContent = '⏸';
        } else {
            pauseTrack();
        }
    });

    nextBtn.addEventListener('click', () => {
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        playTrack();
    });

    prevBtn.addEventListener('click', () => {
        currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
        playTrack();
    });

    audio.addEventListener('timeupdate', () => {
        const { currentTime, duration } = audio;
        if(duration) {
            const percent = (currentTime / duration) * 100;
            progressBar.style.width = `${percent}%`;
        }
    });

    progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        audio.currentTime = (clickX / width) * duration;
    });

    audio.addEventListener('ended', () => {
        nextBtn.click();
    });

    // Handle Local File Uploads (Aap kitne bhi gaane apne phone se select karke add kar sakte hain)
    fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        for(let file of files) {
            const blobUrl = URL.createObjectURL(file);
            tracks.push({
                id: tracks.length + 1,
                title: file.name.replace(/\.[^/.]+$/, ""), // File extension hata kar naam dena
                artist: 'Uploaded Song',
                src: blobUrl
            });
        }
        loadPlaylist();
        alert(files.length + ' songs successfully added!');
    });

    // Initial load
    loadPlaylist();
</script>

</body>
</html>
